[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecdysis"
version = "0.1.0"
description = "Efficient and Effective Training of Runtime Harnesses for LLM Agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
ecdysis = "ecdysis.__main__:main"
ecdysis-run = "ecdysis.benchmark:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/cuiyu-ai/Ecdysis"
Repository = "https://github.com/cuiyu-ai/Ecdysis"

[tool.hatch.build.targets.wheel]
packages = ["src/ecdysis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
